<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><style>
:root{--blue:#153a62;--blue2:#245b92;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#667380;--green:#25805e;--orange:#d97706;--red:#b94040;--line:#e2e7ec;}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{padding-bottom:78px} button,input,select,textarea{font:inherit}
.top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:18px 16px 22px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
.top small{opacity:.82}.top h1{font-size:20px;margin:3px 0 0}.wrap{padding:14px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px #00000012;border:1px solid #eef1f4}
.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:20px;font-weight:750;margin-top:5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px;font-weight:750}.section-title span{font-size:14px;color:var(--muted);font-weight:500}
.progress{height:10px;background:#e6ebef;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green);border-radius:99px}
.btn{border:0;background:var(--blue);color:white;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.btn.alt{background:white;color:var(--blue);border:1px solid #b9c9d8}.btn.danger{background:var(--red)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{min-height:64px;padding:8px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.item h3{font-size:14px;margin:0 0 6px}.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e9eff5;color:var(--blue)}.badge.ok{background:#def3e9;color:#176344}.badge.warn{background:#fff0d5;color:#995b00}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.money{font-weight:750}
.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;color:#667380;font-size:10px;padding:7px 2px}.nav button b{display:block;font-size:20px;line-height:23px}.nav button.active{color:var(--blue);font-weight:800}
.page{display:none}.page.active{display:block}label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #ccd5dd;border-radius:10px;padding:10px;background:white}textarea{min-height:70px}
.modal{position:fixed;inset:0;background:#0008;display:none;z-index:100;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -6px 20px #0003}.sheet h2{font-size:18px;margin:0 0 10px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.filters button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:99px;padding:7px 10px;font-size:12px}.filters button.on{background:var(--blue);color:white}
.gantt{overflow:auto;background:white;border-radius:12px;border:1px solid var(--line)}.gantt table{border-collapse:collapse;min-width:1150px;font-size:10px}.gantt th,.gantt td{border-bottom:1px solid #eef1f4;padding:5px;white-space:nowrap}.gantt .bar{height:12px;background:#4c86bd;border-radius:5px;min-width:4px}
.empty{text-align:center;color:var(--muted);padding:25px 10px}.sep{height:1px;background:var(--line);margin:10px 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:8px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--blue);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:700}.tabs button.on{background:var(--blue);color:white}
.detail-table{width:100%;border-collapse:collapse;font-size:11px}.detail-table th,.detail-table td{padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}.detail-table th{text-align:left;color:var(--muted);font-size:10px}.detail-table td.num{text-align:right;white-space:nowrap}
.scroll-table{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}.scroll-table table{min-width:690px}
.abc-row{display:grid;grid-template-columns:32px 1fr 76px 28px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.abc-bar{height:7px;background:#e6ebef;border-radius:99px;overflow:hidden;margin-top:5px}.abc-bar i{display:block;height:100%;background:var(--blue2)}
.clsA{color:#176344;background:#def3e9}.clsB{color:#995b00;background:#fff0d5}.clsC{color:#7a3940;background:#f8e0e3}
.purchase{display:grid;grid-template-columns:1fr auto;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}.purchase small{color:var(--muted)}.purchase .qty{font-weight:800;text-align:right}
details{border:1px solid var(--line);border-radius:11px;background:#fff;margin:9px 0;overflow:hidden}details>summary{list-style:none;padding:11px 12px;font-weight:750;cursor:pointer;background:#f8fafb}details>summary::-webkit-details-marker{display:none}details .inside{padding:10px 12px}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini{padding:9px;border-radius:9px;background:#f5f8fa}.mini small{display:block;color:var(--muted);font-size:10px}.mini b{font-size:13px}
.search{position:sticky;top:77px;background:var(--bg);padding:4px 0 8px;z-index:3}
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#102f50,#245b92);z-index:500;display:none;align-items:center;justify-content:center;padding:18px}.auth-screen.open{display:flex}.auth-card{background:#fff;width:min(420px,100%);border-radius:20px;padding:22px;box-shadow:0 20px 60px #0005}
.auth-card h2{margin:0 0 5px;color:#153a62}.auth-card p{color:#667380;font-size:13px;margin:0 0 15px}.sync-pill{position:absolute;right:14px;bottom:9px;font-size:10px;background:#ffffff24;padding:4px 8px;border-radius:99px;color:#fff}.sync-pill.ok{background:#1f8a5b}.sync-pill.warn{background:#c77816}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:900px;border-left:1px solid var(--line);border-right:1px solid var(--line)}}

body{background:transparent;font-family:Arial,sans-serif;padding:0;margin:0}
.wrap{max-width:none;padding:0 2px 24px}.top,.nav,.auth-screen{display:none!important}
.page{padding:0}.page:not(.active){display:none}.page.active{display:block}
.tabs button[onclick*="summary"],.tabs button[onclick*="detail"],.tabs button[onclick*="buy"]{display:none}
.mg-tabs-v30,.sch-view-tabs-v31{display:none!important}
.modal{z-index:900}.sheet{max-height:92vh}.casa-runtime-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.casa-runtime-error{padding:12px;background:#fff0f0;color:#a32626;border:1px solid #edbcbc;border-radius:10px}
</style></head><body><p id="runtimeMessage" role="status"></p><main class="wrap"><section id="home" class="page"></section><section id="schedule" class="page"></section><section id="costs" class="page"></section><section id="pls" class="page"></section><section id="budget" class="page"></section><section id="settings" class="page"></section></main><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="dist/casa-runtime.js"></script><script src="dist/casa-runtime-data.js"></script><script src="app-v04-patch.js"></script><script src="app-buy-helpers-v18.js"></script><script src="app-budget-v15.js"></script><script src="app-buy-override-v19.js"></script><script src="app-filters-v24.js"></script><script src="dist/casa-app-budget-io-v27.js"></script><script src="app-budget-edit-v28.js"></script><script src="app-management-v30.js"></script><script src="app-compositions-v33.js"></script><script src="dist/casa-app-budget-export-v34.js"></script><script src="app-detail-composition-v37.js"></script><script src="app-physical-financial-v31.js"></script><script src="app-ui-v32.js"></script><script src="app-service-manager-v35.js"></script><script src="dist/casa-sinapi.js"></script><script src="app-schedule-service-v39.js"></script><script src="app-pls-simulator-v45.js"></script><script src="app-schedule-dates-v46.js"></script><script src="dist/casa-runtime-ready.js"></script></body></html>
