name: Gerar base completa v14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-full-v04.yml'
      - 'payload/**'
      - 'seed-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair base completa ignorando CRC legado
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, re, json

          parts=[]
          for i in range(1,9):
              p=Path(f'payload/{i:02d}.part')
              if not p.exists():
                  raise SystemExit(f'Arquivo ausente: {p}')
              parts.append(''.join(p.read_text(encoding='utf-8').split()))

          raw=base64.b64decode(''.join(parts), validate=True)
          if len(raw) < 20 or raw[0:2] != b'\x1f\x8b':
              raise SystemExit('Pacote não possui cabeçalho GZIP válido')

          # Avança pelo cabeçalho GZIP e ignora apenas CRC/ISIZE finais.
          pos=10
          flg=raw[3]
          if flg & 4:
              xlen=raw[pos] | (raw[pos+1] << 8)
              pos += 2 + xlen
          if flg & 8:
              while pos < len(raw) and raw[pos] != 0: pos += 1
              pos += 1
          if flg & 16:
              while pos < len(raw) and raw[pos] != 0: pos += 1
              pos += 1
          if flg & 2:
              pos += 2

          html=zlib.decompress(raw[pos:-8], -zlib.MAX_WBITS).decode('utf-8')
          m=re.search(r'const SEED=(\{[\s\S]*?\});\s*\nconst KEY=', html)
          if not m:
              raise SystemExit('SEED completo não encontrado')

          seed=json.loads(m.group(1))
          checks={
              'tasks':52,
              'services':204,
              'purchases':313,
              'abc':136,
          }
          for k,n in checks.items():
              got=len(seed.get(k,[]))
              if got != n:
                  raise SystemExit(f'{k}: esperado {n}, encontrado {got}')

          out='window.FULL_SEED='+json.dumps(seed,ensure_ascii=False,separators=(',',':'))+';\n'
          Path('full-seed.js').write_text(out,encoding='utf-8')
          print('BASE OK:', {k:len(seed[k]) for k in checks})
          print('full-seed.js:', len(out.encode('utf-8')), 'bytes')
          PY

      - name: Publicar base textual no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-seed.js
          if git diff --cached --quiet; then
            echo "full-seed.js já está atualizado"
          else
            git commit -m "Gera base completa textual v14 [skip ci]"
            git push
          fi
