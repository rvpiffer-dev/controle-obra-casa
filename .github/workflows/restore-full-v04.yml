name: Publicar app completo v05

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir aplicativo completo
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          parts=[]
          for i in range(1,9):
              p=Path(f'payload/{i:02d}.part')
              if not p.exists():
                  raise SystemExit(f'Arquivo ausente: {p}')
              parts.append(''.join(p.read_text(encoding='utf-8').split()))

          b64=''.join(parts)
          raw=base64.b64decode(b64, validate=True)
          html=gzip.decompress(raw).decode('utf-8')

          # Primeiro valida a base técnica que já existe no pacote.
          for c in ['"id":52','"services":[']:
              if c not in html:
                  raise SystemExit(f'Base técnica inválida: não encontrou {c}')

          # Depois injeta Firebase + gestão v04/v05.
          tags=[
              '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>',
              '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>',
              '<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>',
              '<script src="app-v04-patch.js?v=6"></script>',
              '<script src="firebase-sync-v05.js?v=6"></script>'
          ]
          for tag in tags:
              if tag not in html:
                  html=html.replace('</body>', tag+'\n</body>')

          html=html.replace('<title>Controle da Obra</title>','<title>Controle da Obra v05</title>')
          Path('index.html').write_text(html,encoding='utf-8')
          print('index.html reconstruído:', len(html), 'bytes')
          PY

      - name: Conferir versão publicada
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
              '"id":52',
              '"services":[',
              'firebase-app-compat.js',
              'firebase-auth-compat.js',
              'firebase-firestore-compat.js',
              'app-v04-patch.js?v=6',
              'firebase-sync-v05.js?v=6'
          ]
          for c in checks:
              assert c in s, f'Falhou validação: {c}'
          print('VALIDAÇÃO OK — base completa + Firebase')
          PY

      - name: Publicar no branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html já está atualizado"
          else
            git commit -m "Publica aplicativo completo v05 [skip ci]"
            git push
          fi
