<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#153a62" />
<title>Controle da Obra</title>
<style>
:root{--blue:#153a62;--blue2:#245b92;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#667380;--green:#25805e;--orange:#d97706;--red:#b94040;--line:#e2e7ec;}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{padding-bottom:78px} button,input,select,textarea{font:inherit}
.top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:18px 16px 22px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
.top small{opacity:.82}.top h1{font-size:20px;margin:3px 0 0}.wrap{padding:14px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px #00000012;border:1px solid #eef1f4}
.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:20px;font-weight:750;margin-top:5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px;font-weight:750}.section-title span{font-size:14px;color:var(--muted);font-weight:500}
.progress{height:10px;background:#e6ebef;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--green);border-radius:99px}
.btn{border:0;background:var(--blue);color:white;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.btn.alt{background:white;color:var(--blue);border:1px solid #b9c9d8}.btn.danger{background:var(--red)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{min-height:64px;padding:8px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.item h3{font-size:14px;margin:0 0 6px}.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#e9eff5;color:var(--blue)}.badge.ok{background:#def3e9;color:#176344}.badge.warn{background:#fff0d5;color:#995b00}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.money{font-weight:750}
.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;color:#667380;font-size:10px;padding:7px 2px}.nav button b{display:block;font-size:20px;line-height:23px}.nav button.active{color:var(--blue);font-weight:800}
.page{display:none}.page.active{display:block}label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #ccd5dd;border-radius:10px;padding:10px;background:white}textarea{min-height:70px}
.modal{position:fixed;inset:0;background:#0008;display:none;z-index:100;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -6px 20px #0003}.sheet h2{font-size:18px;margin:0 0 10px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.filters button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:99px;padding:7px 10px;font-size:12px}.filters button.on{background:var(--blue);color:white}
.gantt{overflow:auto;background:white;border-radius:12px;border:1px solid var(--line)}.gantt table{border-collapse:collapse;min-width:1150px;font-size:10px}.gantt th,.gantt td{border-bottom:1px solid #eef1f4;padding:5px;white-space:nowrap}.gantt .bar{height:12px;background:#4c86bd;border-radius:5px;min-width:4px}
.empty{text-align:center;color:var(--muted);padding:25px 10px}.sep{height:1px;background:var(--line);margin:10px 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:8px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--blue);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:700}.tabs button.on{background:var(--blue);color:white}
.detail-table{width:100%;border-collapse:collapse;font-size:11px}.detail-table th,.detail-table td{padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}.detail-table th{text-align:left;color:var(--muted);font-size:10px}.detail-table td.num{text-align:right;white-space:nowrap}
.scroll-table{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}.scroll-table table{min-width:690px}
.abc-row{display:grid;grid-template-columns:32px 1fr 76px 28px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.abc-bar{height:7px;background:#e6ebef;border-radius:99px;overflow:hidden;margin-top:5px}.abc-bar i{display:block;height:100%;background:var(--blue2)}
.clsA{color:#176344;background:#def3e9}.clsB{color:#995b00;background:#fff0d5}.clsC{color:#7a3940;background:#f8e0e3}
.purchase{display:grid;grid-template-columns:1fr auto;gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}.purchase small{color:var(--muted)}.purchase .qty{font-weight:800;text-align:right}
details{border:1px solid var(--line);border-radius:11px;background:#fff;margin:9px 0;overflow:hidden}details>summary{list-style:none;padding:11px 12px;font-weight:750;cursor:pointer;background:#f8fafb}details>summary::-webkit-details-marker{display:none}details .inside{padding:10px 12px}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini{padding:9px;border-radius:9px;background:#f5f8fa}.mini small{display:block;color:var(--muted);font-size:10px}.mini b{font-size:13px}
.search{position:sticky;top:77px;background:var(--bg);padding:4px 0 8px;z-index:3}
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#102f50,#245b92);z-index:500;display:none;align-items:center;justify-content:center;padding:18px}.auth-screen.open{display:flex}.auth-card{background:#fff;width:min(420px,100%);border-radius:20px;padding:22px;box-shadow:0 20px 60px #0005}
.auth-card h2{margin:0 0 5px;color:#153a62}.auth-card p{color:#667380;font-size:13px;margin:0 0 15px}.sync-pill{position:absolute;right:14px;bottom:9px;font-size:10px;background:#ffffff24;padding:4px 8px;border-radius:99px;color:#fff}.sync-pill.ok{background:#1f8a5b}.sync-pill.warn{background:#c77816}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.nav{left:50%;transform:translateX(-50%);max-width:900px;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><h2>Controle da Obra</h2><p>Entre para sincronizar a obra entre celular e computador.</p><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email"><label>Senha</label><input id="loginPassword" type="password"><button class="btn" style="width:100%;margin-top:14px" onclick="loginFirebase()">Entrar</button><div id="loginError" style="color:#b94040;font-size:12px;margin-top:10px"></div></div></div>
<header class="top"><small>Controle compartilhado da obra</small><h1>Casa Ramon e Talita</h1><span id="syncPill" class="sync-pill warn">conectando…</span></header>
<main class="wrap"><section id="home" class="page active"></section><section id="schedule" class="page"></section><section id="costs" class="page"></section><section id="pls" class="page"></section><section id="budget" class="page"></section><section id="settings" class="page"></section></main>
<nav class="nav"><button data-page="home" class="active"><b>⌂</b>Início</button><button data-page="schedule"><b>▤</b>Cronograma</button><button data-page="costs"><b>＋</b>Custos</button><button data-page="pls"><b>◉</b>PLS</button><button data-page="budget"><b>R$</b>Orçamento</button><button data-page="settings"><b>⚙</b>Ajustes</button></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const SEED={"project":{"name":"Casa Ramon e Talita","start":"2026-09-14","budget":396665.4840614804},"tasks":[{"id":1,"phase":"01 Preliminares","name":"Tapume frontal","origin":"01.01","duration":1,"preds":"","start":"2026-09-14","finish":"2026-09-14","progress":0,"resource":"Equipe fixa 2+2","plannedCost":1332.1440132,"notes":""},{"id":2,"phase":"01 Preliminares","name":"Gabarito, locação e marcação dos eixos/estacas","origin":"01.03","duration":3,"preds":"1","start":"2026-09-15","finish":"2026-09-17","progress":0,"resource":"Equipe fixa 2+2","plannedCost":4964.14925,"notes":""}],"pls":[{"stage":1,"date":"2026-10-14","stagePct":0.05,"cumPct":0.05,"status":"Planejada","notes":""},{"stage":2,"date":"2026-11-16","stagePct":0.15,"cumPct":0.2,"status":"Planejada","notes":""},{"stage":3,"date":"2026-12-14","stagePct":0.15,"cumPct":0.35,"status":"Planejada","notes":""},{"stage":4,"date":"2027-01-14","stagePct":0.1,"cumPct":0.45,"status":"Planejada","notes":""},{"stage":5,"date":"2027-02-15","stagePct":0.1,"cumPct":0.55,"status":"Planejada","notes":""},{"stage":6,"date":"2027-03-15","stagePct":0.1,"cumPct":0.65,"status":"Planejada","notes":""},{"stage":7,"date":"2027-04-14","stagePct":0.1,"cumPct":0.75,"status":"Planejada","notes":""},{"stage":8,"date":"2027-05-14","stagePct":0.05,"cumPct":0.8,"status":"Planejada","notes":""},{"stage":9,"date":"2027-06-14","stagePct":0.05,"cumPct":0.85,"status":"Planejada","notes":""},{"stage":10,"date":"2027-07-14","stagePct":0.05,"cumPct":0.9,"status":"Planejada","notes":""},{"stage":11,"date":"2027-08-16","stagePct":0.05,"cumPct":0.95,"status":"Planejada","notes":""},{"stage":12,"date":"2027-09-14","stagePct":0.05,"cumPct":1,"status":"Planejada","notes":""}],"macros":[],"costs":[],"services":[],"abc":[],"purchases":[]};
const KEY='controleObraCasaRT_v3',PROJECT_DOC='casa-ramon-talita';
const firebaseConfig={apiKey:"AIzaSyDuEvZt8yvQF1OoiQoeYd9YSjiZPc1Wjgg",authDomain:"controle-obra-casa-a3d59.firebaseapp.com",projectId:"controle-obra-casa-a3d59",storageBucket:"controle-obra-casa-a3d59.firebasestorage.app",messagingSenderId:"157648632089",appId:"1:157648632089:web:9e9fef4de3cd6dd451ad88"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});let cloudReady=false,applyingRemote=false,unsubscribeCloud=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):clone(SEED)}catch(e){return clone(SEED)}}let state=load();
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0),pct=v=>new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(v||0),date=v=>v?new Intl.DateTimeFormat('pt-BR').format(new Date(v+'T12:00:00')):'—';
function setSync(t,ok=false){const e=document.getElementById('syncPill');e.textContent=t;e.className='sync-pill '+(ok?'ok':'warn')}function renderAll(){renderHome();renderSchedule();renderCosts();renderPLS();renderBudget();renderSettings()}
async function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll();if(auth.currentUser&&cloudReady&&!applyingRemote){setSync('salvando…');try{await db.collection('projects').doc(PROJECT_DOC).set({state,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email||auth.currentUser.uid});setSync('sincronizado',true)}catch(e){setSync('offline/local')}}}
async function startCloud(user){if(unsubscribeCloud)unsubscribeCloud();const ref=db.collection('projects').doc(PROJECT_DOC);try{const snap=await ref.get();if(!snap.exists)await ref.set({state,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:user.email||user.uid});else if(snap.data()?.state){applyingRemote=true;state=snap.data().state;localStorage.setItem(KEY,JSON.stringify(state));renderAll();applyingRemote=false}cloudReady=true;setSync('sincronizado',true);unsubscribeCloud=ref.onSnapshot(s=>{if(s.exists&&s.data()?.state){applyingRemote=true;state=s.data().state;localStorage.setItem(KEY,JSON.stringify(state));renderAll();applyingRemote=false;setSync('sincronizado',true)}},()=>setSync('offline/local'))}catch(e){setSync('sem acesso ao banco')}}
async function loginFirebase(){loginError.textContent='';try{await auth.signInWithEmailAndPassword(loginEmail.value.trim(),loginPassword.value)}catch(e){loginError.textContent='Não foi possível entrar. Confira e-mail/senha e se o usuário foi criado no Firebase.'}}function logoutFirebase(){auth.signOut()}auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(u=>{if(u){authScreen.classList.remove('open');startCloud(u)}else{cloudReady=false;authScreen.classList.add('open');setSync('login necessário')}});
function totals(){let launched=0,paid=0;(state.costs||[]).forEach(c=>{launched+=+c.amount||0;paid+=+c.paid||0});return{launched,paid,payable:Math.max(0,launched-paid)}}function weightedProgress(){const t=(state.tasks||[]).reduce((a,x)=>a+x.plannedCost,0)||1;return state.tasks.reduce((a,x)=>a+x.plannedCost*(x.progress||0),0)/t}function nextTask(){return state.tasks.find(x=>(x.progress||0)<1)||state.tasks.at(-1)}function nextPLS(){return state.pls.find(x=>!['Liberada','Vistoriada'].includes(x.status))||state.pls.at(-1)}
function renderHome(){const t=totals(),p=weightedProgress(),nt=nextTask(),np=nextPLS();home.innerHTML=`<div class="grid"><div class="card kpi"><div class="label">Orçamento</div><div class="value">${brl(state.project.budget)}</div></div><div class="card kpi"><div class="label">Pago</div><div class="value">${brl(t.paid)}</div></div><div class="card kpi"><div class="label">Avanço físico</div><div class="value">${pct(p)}</div></div><div class="card kpi"><div class="label">Saldo</div><div class="value">${brl(state.project.budget-t.launched)}</div></div></div><div class="section-title">Próxima atividade</div><div class="item"><h3>${nt.name}</h3><div class="meta"><span>${date(nt.start)} → ${date(nt.finish)}</span></div><div class="progress"><i style="width:${nt.progress*100}%"></i></div></div><div class="section-title">Próxima medição PLS</div><div class="item"><h3>Etapa ${np.stage} · ${pct(np.cumPct)}</h3><div class="meta"><span>${date(np.date)}</span><span class="badge">${np.status}</span></div></div>`}
function renderSchedule(){schedule.innerHTML=`<div class="section-title">Cronograma <span>${state.tasks.length} atividades</span></div><div class="list">${state.tasks.map(x=>`<div class="item" onclick="taskForm(${x.id})"><div class="row"><div class="grow"><h3>${x.id}. ${x.name}</h3><div class="meta"><span>${x.phase}</span><span>${date(x.start)} → ${date(x.finish)}</span></div></div><span class="badge ${x.progress>=1?'ok':x.progress>0?'warn':''}">${pct(x.progress)}</span></div></div>`).join('')}</div>`}
function taskForm(id){const x=state.tasks.find(t=>t.id===id);openModal(`<h2>${x.name}</h2><label>Percentual executado</label><input id="taskProgress" type="range" min="0" max="100" value="${x.progress*100}"><label>Observações</label><textarea id="taskNotes">${x.notes||''}</textarea><div class="actions"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" onclick="updateTask(${id})">Salvar</button></div>`)}function updateTask(id){const x=state.tasks.find(t=>t.id===id);x.progress=+taskProgress.value/100;x.notes=taskNotes.value;closeModal();save()}
function renderCosts(){const t=totals();costs.innerHTML=`<div class="section-title">Custos <button class="btn" onclick="costForm()">＋ Novo</button></div><div class="grid"><div class="card kpi"><div class="label">Lançado</div><div class="value">${brl(t.launched)}</div></div><div class="card kpi"><div class="label">Pago</div><div class="value">${brl(t.paid)}</div></div></div><div class="list">${(state.costs||[]).slice().reverse().map(c=>`<div class="item"><h3>${c.description}</h3><div class="row"><span class="grow meta">${date(c.date)} · ${c.supplier||''}</span><b>${brl(c.amount)}</b></div></div>`).join('')}</div>`}function costForm(){openModal(`<h2>Novo custo</h2><label>Data</label><input id="cDate" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Descrição</label><input id="cDesc"><label>Fornecedor</label><input id="cSupp"><label>Valor</label><input id="cAmt" type="number" step="0.01"><label>Valor pago</label><input id="cPaid" type="number" step="0.01"><div class="actions"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" onclick="addCost()">Salvar</button></div>`)}function addCost(){state.costs.push({id:Date.now(),date:cDate.value,description:cDesc.value,supplier:cSupp.value,amount:+cAmt.value||0,paid:+cPaid.value||0});closeModal();save()}
function renderPLS(){pls.innerHTML=`<div class="section-title">Medições PLS</div><div class="list">${state.pls.map(x=>`<div class="item"><h3>Etapa ${x.stage} · acumulado ${pct(x.cumPct)}</h3><div class="meta"><span>${date(x.date)}</span></div><label>Status</label><select onchange="updatePLS(${x.stage},this.value)"><option ${x.status==='Planejada'?'selected':''}>Planejada</option><option ${x.status==='Solicitada'?'selected':''}>Solicitada</option><option ${x.status==='Vistoriada'?'selected':''}>Vistoriada</option><option ${x.status==='Liberada'?'selected':''}>Liberada</option></select></div>`).join('')}</div>`}function updatePLS(s,v){state.pls.find(x=>x.stage===s).status=v;save()}
function renderBudget(){budget.innerHTML=`<div class="section-title">Orçamento</div><div class="card">A versão detalhada do orçamento será sincronizada depois da validação do login. Base atual: <b>${brl(state.project.budget)}</b>.</div>`}function renderSettings(){settings.innerHTML=`<div class="section-title">Conta e sincronização</div><div class="card"><p>Os dados são sincronizados no Firestore e mantidos também neste aparelho para uso offline.</p><button class="btn alt" onclick="logoutFirebase()">Sair da conta</button></div>`}
function openModal(h){sheet.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}modal.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));renderAll();scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));renderAll();
</script></body></html>
